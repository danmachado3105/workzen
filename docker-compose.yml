services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: workzen
      POSTGRES_PASSWORD: workzen
      POSTGRES_DB: workzen
    ports:
      - "5432:5432"
    volumes:
      - workzen_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  workzen_db_data: