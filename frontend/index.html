<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0a" />
    <meta name="description" content="Gestão de clientes, serviços e agendamentos para prestadores de serviços." />
    <title>WorkZen</title>
    <script>
      try {
        const theme = localStorage.getItem("workzen_theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f4f6f1" : "#0a0b0a");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
